[project]
name = "asp-python"
version = "0.1.0"
description = "Python-native policy and semantic tooling with compact diagnostics for agents"
readme = "README.md"
requires-python = ">=3.12"
import-names = [
    "python_lang_parser",
    "asp_python",
]
dependencies = ["blake3>=1.0.8,<2"]

[project.optional-dependencies]
pytest = [
    "pytest>=8.0",
]

[project.scripts]
asp-python = "asp_python:run_cli_from_env"

[project.entry-points.pytest11]
asp_python = "asp_python.pytest_plugin"

[dependency-groups]
test = [
    "pytest>=8.0",
    "ruff>=0.13",
    "syrupy>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/python_lang_parser",
    "src/asp_python",
]

[tool.hatch.build.targets.wheel.force-include]
"schemas/python-semantic-capabilities.v1.schema.json" = "asp_python/schemas/python-semantic-capabilities.v1.schema.json"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.asp-python.verification.profile_hints]]
owner_path = "pyproject.toml"
responsibilities = ["pytest_gate"]
verification_tasks_enabled = false
rationale = "self pytest addopts and CI cover the ASP Python gate contract"

[[tool.asp-python.verification.profile_hints]]
owner_path = "src/python_lang_parser/__init__.py"
responsibilities = ["public_api"]
verification_tasks_enabled = false
rationale = "self parser tests, ASP Python CLI, and build cover the parser public facade"

[[tool.asp-python.verification.profile_hints]]
owner_path = "src/asp_python/__init__.py"
responsibilities = ["public_api", "cli"]
verification_tasks_enabled = false
rationale = "self public API tests, CLI tests, pytest gate, and build cover the ASP Python facade"

[[tool.asp-python.verification.profile_hints]]
owner_path = "src/asp_python/pytest_plugin.py"
responsibilities = ["cli"]
verification_tasks_enabled = false
rationale = "self pytest addopts exercise the pytest plugin gate"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
